<html lang="en">
<head>

</head>
<style>
    div{
        height: 150px;
        width: 300px;
        padding: 10px;

        margin: 10px;
    }
</style>
<body>
    <h2> Javascript Basics</h2>
    <div onclick="clickfunc()">

        <p id ="enter"> 0</p>
    </div>
    <button id ="nothingbutton" onclick="doNothing()" >
        DO NOTHING!!!
    </button>

    <button id="myButton">
        Click Me
    </button>


    <script src="script.js"></script>
